<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080e13">
<meta name="description" content="Open AI Job Finder — your resume and job discovery companion.">
<title>AI Job Finder | Main Page</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;--bg:#080e13;--surface:#101b22;--text:#eef8f5;--muted:#9aafb0;--accent:#18dbb1;--accent2:#76f3d9;--line:#29423f;--shadow:rgba(24,219,177,.16)}
:root[data-theme="warm-light"]{color-scheme:light;--bg:#faf7ef;--surface:#fffdf7;--text:#293633;--muted:#65716a;--accent:#087f6d;--accent2:#086c60;--line:#dedfd0;--shadow:rgba(8,127,109,.12)}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);transition:background .25s,color .25s}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 48% 35% at 50% 40%,var(--shadow),transparent 85%);opacity:.85}
.shell{position:relative;max-width:1080px;min-height:100vh;margin:auto;padding:28px 28px 20px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:800;letter-spacing:.11em;font-size:.85rem}.brand span{color:var(--accent)}
.theme-switch{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);padding:5px;border-radius:30px}.theme-switch button{background:transparent;color:var(--muted);border:0;border-radius:24px;padding:9px 12px;cursor:pointer;font:inherit;font-size:.82rem}.theme-switch button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:700}:root[data-theme="warm-light"] .theme-switch button[aria-pressed="true"]{color:white}
main{flex:1;display:grid;place-items:center;text-align:center;padding:72px 0}.hero{width:100%;max-width:730px}.eyebrow{display:inline-block;border:1px solid var(--line);border-radius:30px;color:var(--accent2);font-size:.76rem;letter-spacing:.14em;padding:9px 15px;font-weight:700;text-transform:uppercase}
h1{font-size:clamp(3.2rem,9vw,6.5rem);letter-spacing:-.065em;line-height:1.04;margin:26px 0 14px;font-weight:850}.highlight{color:var(--accent)}.subtitle{color:var(--muted);font-size:clamp(1rem,2vw,1.17rem);line-height:1.7;margin:0 auto 34px;max-width:550px}
.cta{display:inline-flex;justify-content:center;align-items:center;gap:14px;min-width:285px;padding:19px 29px;background:var(--accent);color:#061a18;text-decoration:none;font-size:1rem;font-weight:800;letter-spacing:.025em;border-radius:11px;border:1px solid var(--accent);box-shadow:0 0 26px var(--shadow);transition:transform .2s,box-shadow .2s,background .2s}.cta:hover{transform:translateY(-3px);box-shadow:0 0 38px var(--shadow);background:var(--accent2)}.cta:focus-visible,.theme-switch button:focus-visible{outline:3px solid var(--accent2);outline-offset:4px}
:root[data-theme="warm-light"] .cta{color:white}.arrow{font-size:1.35rem;line-height:1}.destination{margin:20px auto 0;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}.destination a{color:var(--accent2);text-underline-offset:3px}
footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:.78rem;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.device-note{width:100%;text-align:center;font-size:.69rem;letter-spacing:.015em;line-height:1.5;color:var(--muted);margin:2px 0 0}.device-note span{color:var(--accent2);font-weight:800}
@media(max-width:600px){.shell{padding:20px}.brand{font-size:.73rem}.theme-switch button{padding:8px;font-size:.75rem}main{padding:60px 0}.cta{width:100%;min-width:0}footer{justify-content:center;text-align:center}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header>
<div class="brand">✦ <span>AI</span> JOB FINDER</div>
<nav class="theme-switch" aria-label="Color theme">
<button type="button" data-set-theme="dark" aria-pressed="true">Dark</button>
<button type="button" data-set-theme="warm-light" aria-pressed="false">Warm Light</button>
</nav>
</header>
<main>
<section class="hero" aria-labelledby="hero-title">
<div class="eyebrow">Your job discovery gateway</div>
<h1 id="hero-title">AI JOB <span class="highlight">FINDER</span></h1>
<p class="subtitle">Click this button to go to the main webpage.</p>
<a class="cta" href="https://ai-j0b-finder.streamlit.app/" aria-label="Go to the AI Job Finder webpage">GO TO THE WEBPAGE <span class="arrow" aria-hidden="true">↗</span></a>
<p class="destination">Destination: <a href="https://ai-j0b-finder.streamlit.app/">ai-j0b-finder.streamlit.app</a></p>
</section>
</main>
<footer><span>AI JOB FINDER · Main page</span><span>A simple gateway to the application</span><p class="device-note"><span aria-hidden="true">*</span> Please use a desktop device or desktop mode to view this webpage.</p></footer>
</div>
<script>
const root=document.documentElement;
const buttons=document.querySelectorAll("[data-set-theme]");
function setTheme(theme){
 if(!["dark","warm-light"].includes(theme))return;
 root.dataset.theme=theme;
 buttons.forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.setTheme===theme)));
 try{localStorage.setItem("ai-job-finder-theme",theme)}catch(e){}
}
buttons.forEach(button=>button.addEventListener("click",()=>setTheme(button.dataset.setTheme)));
try{setTheme(localStorage.getItem("ai-job-finder-theme")||"dark")}catch(e){setTheme("dark")}
</script>
</body>
</html>
